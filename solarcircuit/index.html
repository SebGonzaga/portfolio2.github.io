<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SolarCircuit — Wanderer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<style>
  :root{
    --void:#04050d;
    --navy-deep:#080b22;
    --navy:#0f1638;
    --line: rgba(150,157,214,0.22);
    --line-bright: rgba(150,157,214,0.5);
    --cream:#EEEBE3;
    --lavender:#9195c4;
    --lavender-dim:#5c6091;
    --gold:#F4C77B;
    --gold-dim:#c99a52;

    --mercury-1:#d8d6cd; --mercury-2:#8c8a80; --mercury-3:#514f47;
    --venus-1:#f0dfae;  --venus-2:#d6ab5e;  --venus-3:#96693a;
    --earth-1:#6fa8dc;  --earth-2:#2c5c9e;  --earth-3:#3f7d4a;
    --mars-1:#e17b4a;   --mars-2:#b8481a;   --mars-3:#6e260c;
    --jupiter-1:#e3c39a; --jupiter-2:#c8925a; --jupiter-3:#8a5a33;
    --saturn-1:#e9d6a4;  --saturn-2:#c7a565;  --saturn-3:#8f7444;
    --uranus-1:#bdeaec;  --uranus-2:#78c1c6;  --uranus-3:#3f8a90;
    --neptune-1:#5f83e0; --neptune-2:#2f4bb0;  --neptune-3:#182a6e;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background: var(--void);
    color: var(--cream);
    font-family:'Inter', sans-serif;
    overflow:hidden;
    position:relative;
  }
  ::selection{ background: var(--gold-dim); color:var(--void); }

  /* ---------- starfield + void ---------- */
  .stars{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  .stars.deep{
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 120px 90px, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 250px 60px, rgba(255,255,255,0.45), transparent),
      radial-gradient(1px 1px at 340px 200px, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 60px 220px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 400px 340px, rgba(255,255,255,0.3), transparent);
    background-repeat: repeat; background-size: 420px 420px; opacity:0.55;
  }
  .stars.near{
    background-image:
      radial-gradient(2px 2px at 80px 60px, rgba(255,255,255,0.7), transparent),
      radial-gradient(1.5px 1.5px at 200px 180px, rgba(255,255,255,0.5), transparent),
      radial-gradient(2px 2px at 320px 40px, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 380px 260px, rgba(255,255,255,0.45), transparent),
      radial-gradient(2px 2px at 140px 300px, rgba(255,255,255,0.55), transparent);
    background-repeat: repeat; background-size: 500px 500px; opacity:0.7;
  }
  .void-gradient{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 70% 55% at 50% 46%, rgba(244,199,123,0.07), transparent 62%),
      radial-gradient(ellipse 120% 90% at 50% 120%, var(--navy) 0%, var(--void) 60%),
      var(--void);
  }

  .app{ position:relative; z-index:2; height:100vh; display:flex; flex-direction:column; }

  /* ---------- top nav ---------- */
  .topnav{
    display:flex; align-items:center; justify-content:space-between;
    padding: 2.2rem 3rem 0;
  }
  .logo{
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.22em;
    text-transform:uppercase; color: var(--cream); display:flex; align-items:center; gap:8px;
  }
  .logo::before{
    content:''; width:7px; height:7px; border-radius:50%;
    background: var(--gold); box-shadow: 0 0 8px 2px rgba(244,199,123,0.6);
  }
  .menu-btn{
    background:none; border:1px solid var(--line); color:var(--cream);
    width:36px; height:36px; border-radius:50%; font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; letter-spacing:2px;
    transition: border-color .2s ease, background .2s ease;
  }
  .menu-btn:hover{ border-color: var(--line-bright); background: rgba(255,255,255,0.03); }

  /* ---------- stage ---------- */
  .stage{
    position:relative; flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding: 0 2rem;
  }

  .orbit-line{
    position:absolute; left:6%; right:6%; top:38%;
    height:1px; background: linear-gradient(90deg, transparent, var(--line) 12%, var(--line) 88%, transparent);
    z-index:1;
  }

  .planet-row{
    position:relative; z-index:2; width:100%; max-width:1200px;
    display:flex; align-items:center; justify-content:space-between;
    height: 200px; margin-top: -2vh;
  }

  .planet-node{
    background:none; border:none; cursor:pointer; position:relative;
    display:flex; align-items:center; justify-content:center;
    padding: 0; will-change: transform;
  }
  .planet-node .sphere{
    border-radius:50%; position:relative;
  }
  .planet-node .sphere::after{
    content:''; position:absolute; inset:0; border-radius:50%;
    background: radial-gradient(circle at 68% 72%, rgba(0,0,0,0.35), transparent 55%),
                radial-gradient(circle at 30% 25%, rgba(255,255,255,0.2), transparent 45%);
  }
  .planet-node .glow-ring{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:220%; height:220%; border-radius:50%;
    background: radial-gradient(circle, rgba(244,199,123,0.35), rgba(244,199,123,0.08) 45%, transparent 72%);
    opacity:0; pointer-events:none;
  }
  .planet-node .tick{
    position:absolute; bottom:-22px; left:50%; transform:translateX(-50%);
    width:1px; height:14px; background: var(--line);
  }

  /* per-planet colors */
  .mercury .sphere{ background: radial-gradient(circle at 32% 30%, var(--mercury-1), var(--mercury-2) 55%, var(--mercury-3) 100%); }
  .venus .sphere{ background: radial-gradient(circle at 32% 30%, var(--venus-1), var(--venus-2) 55%, var(--venus-3) 100%); }
  .earth .sphere{
    background:
      radial-gradient(ellipse 30% 20% at 30% 35%, var(--earth-3) 0%, transparent 70%),
      radial-gradient(ellipse 22% 16% at 65% 60%, var(--earth-3) 0%, transparent 70%),
      radial-gradient(ellipse 18% 26% at 55% 20%, var(--earth-3) 0%, transparent 70%),
      radial-gradient(circle at 32% 30%, var(--earth-1), var(--earth-2) 65%, #1c3d6e 100%);
  }
  .mars .sphere{ background: radial-gradient(circle at 32% 30%, var(--mars-1), var(--mars-2) 55%, var(--mars-3) 100%); }
  .jupiter .sphere{
    background: repeating-linear-gradient(4deg, var(--jupiter-1) 0px, var(--jupiter-1) 14px, var(--jupiter-2) 14px, var(--jupiter-2) 26px, var(--jupiter-3) 26px, var(--jupiter-3) 34px, var(--jupiter-1) 34px, var(--jupiter-1) 46px);
  }
  .saturn .sphere{
    background: repeating-linear-gradient(2deg, var(--saturn-1) 0px, var(--saturn-1) 16px, var(--saturn-2) 16px, var(--saturn-2) 28px, var(--saturn-3) 28px, var(--saturn-3) 34px);
  }
  .uranus .sphere{ background: radial-gradient(circle at 35% 32%, var(--uranus-1), var(--uranus-2) 55%, var(--uranus-3) 100%); }
  .neptune .sphere{ background: radial-gradient(circle at 35% 32%, var(--neptune-1), var(--neptune-2) 55%, var(--neptune-3) 100%); }

  .planet-node.active .sphere{
    box-shadow: 0 0 50px 6px rgba(244,199,123,0.18), 0 0 110px 30px rgba(244,199,123,0.10);
  }

  .saturn-rings{
    position:absolute; top:50%; left:50%; width:190%; height:64%;
    transform: translate(-50%,-50%) rotate(-14deg);
    border: 3px solid rgba(215,196,152,0.4);
    border-top-color: rgba(215,196,152,0.15);
    border-bottom-color: rgba(215,196,152,0.65);
    border-radius:50%; pointer-events:none;
  }

  /* ---------- center info ---------- */
  .center-info{
    position:relative; z-index:2; text-align:center; margin-top: 3vh;
    max-width: 46ch;
  }
  .planet-eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.24em;
    text-transform:uppercase; color: var(--lavender-dim); margin-bottom:0.6rem;
  }
  .planet-title{
    font-family:'Fraunces', serif; font-weight:500; font-style:italic;
    font-size: clamp(1.6rem, 3vw, 2.2rem); color: var(--cream); margin-bottom:0.9rem;
    letter-spacing:0.01em;
  }
  .planet-title .bracket{ color: var(--gold-dim); font-style:normal; }
  .planet-desc{
    color: var(--lavender); font-size:0.92rem; line-height:1.65; margin-bottom:1.4rem;
    min-height: 4.4em;
  }
  .cta{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace; font-size:11.5px; letter-spacing:0.08em;
    color: var(--cream); text-decoration:none; border-bottom:1px solid var(--line-bright);
    padding-bottom:3px; transition: color .2s ease, border-color .2s ease;
  }
  .cta em{ font-style:normal; color: var(--gold); }
  .cta:hover{ color: var(--gold); border-color: var(--gold); }
  .cta::after{ content:'→'; font-size:12px; }

  .stat-strip{
    display:flex; justify-content:center; gap: 2.2rem; margin-top:1.6rem;
    padding-top:1.2rem; border-top:1px solid var(--line);
  }
  .stat{ display:flex; flex-direction:column; gap:4px; align-items:center; }
  .stat-label{ font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.1em; color: var(--lavender-dim); text-transform:uppercase; }
  .stat-value{ font-family:'JetBrains Mono', monospace; font-size:12.5px; color: var(--gold); }

  /* ---------- bottom bar ---------- */
  .bottombar{
    display:flex; align-items:center; justify-content:center; gap:14px;
    padding: 2rem 0 2.4rem; position:relative; z-index:2;
  }
  .pager-dot{
    width:6px; height:6px; border-radius:50%; background: var(--lavender-dim);
    border:none; cursor:pointer; padding:0;
  }
  .pager-dot.active{ background: var(--gold); width:18px; border-radius:4px; }

  @media (max-width: 820px){
    .topnav{ padding: 1.4rem 1.4rem 0; }
    .planet-row{ height:120px; }
    .stat-strip{ gap:1.2rem; flex-wrap:wrap; }
    .stage{ padding: 0 1rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .planet-node, .planet-node .sphere{ transition:none; }
  }

  :focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
</style>
</head>
<body>

<div class="void-gradient"></div>
<div class="stars deep"></div>
<div class="stars near"></div>

<div class="app">

  <nav class="topnav">
    <div class="logo">SolarCircuit</div>
    <button class="menu-btn" aria-label="Menu">≡</button>
  </nav>

  <div class="stage">
    <div class="orbit-line" id="orbitLine"></div>
    <div class="planet-row" id="planetRow"></div>

    <div class="center-info" id="centerInfo">
      <span class="planet-eyebrow" id="planetEyebrow">03 — HOME</span>
      <h1 class="planet-title" id="planetTitle"><span class="bracket">(</span> <span id="planetName">earth</span> <span class="bracket">)</span></h1>
      <p class="planet-desc" id="planetDesc"></p>
      <a class="cta" id="planetCta" href="#">What is the <em>Solar System</em>?</a>
      <div class="stat-strip" id="statStrip"></div>
    </div>
  </div>

  <div class="bottombar" id="pager"></div>

</div>

<script>
(function(){
  var planets = [
    { key:'mercury', name:'Mercury', idx:'01 — CLOSEST TO THE SUN', size:34,
      desc:'A cratered, airless world of extremes — scorched by day, frozen by night, with almost nothing to hold the heat in between.',
      diameter:'4,879 km', distance:'0.39 AU', moons:'0', period:'88 days' },
    { key:'venus', name:'Venus', idx:'02 — THE MORNING STAR', size:46,
      desc:'Wrapped in thick cloud and crushing pressure, Venus is the hottest planet in the system — and the only one that spins backward.',
      diameter:'12,104 km', distance:'0.72 AU', moons:'0', period:'225 days' },
    { key:'earth', name:'Earth', idx:'03 — HOME', size:100,
      desc:'The only world we know of where oceans stay liquid, skies stay blue, and something learned to look back up at the stars.',
      diameter:'12,742 km', distance:'1.00 AU', moons:'1', period:'365.25 days' },
    { key:'mars', name:'Mars', idx:'04 — THE RED PLANET', size:40,
      desc:'Rust-colored deserts, polar ice, and a volcano nearly three times the height of Everest make Mars the system\'s most ambitious frontier.',
      diameter:'6,779 km', distance:'1.52 AU', moons:'2', period:'687 days' },
    { key:'jupiter', name:'Jupiter', idx:'05 — THE GIANT', size:70,
      desc:'Bigger than every other planet combined, Jupiter\'s banded clouds hide a storm wide enough to swallow Earth whole.',
      diameter:'139,820 km', distance:'5.20 AU', moons:'95', period:'~12 years' },
    { key:'saturn', name:'Saturn', idx:'06 — THE RINGED WORLD', size:62, rings:true,
      desc:'Girdled by rings of ice and rock, Saturn is so light for its size that it would float in a bathtub large enough to hold it.',
      diameter:'116,460 km', distance:'9.54 AU', moons:'146', period:'~29 years' },
    { key:'uranus', name:'Uranus', idx:'07 — THE TILTED WORLD', size:48,
      desc:'Knocked onto its side by some ancient collision, Uranus rolls around the Sun like a ball rather than spinning like a top.',
      diameter:'50,724 km', distance:'19.2 AU', moons:'27', period:'~84 years' },
    { key:'neptune', name:'Neptune', idx:'08 — THE EDGE OF THE SYSTEM', size:46,
      desc:'The farthest planet from the Sun, Neptune is a deep-blue world of supersonic winds — the fastest in the solar system.',
      diameter:'49,244 km', distance:'30.1 AU', moons:'14', period:'~165 years' }
  ];

  var row = document.getElementById('planetRow');
  var pager = document.getElementById('pager');
  var active = 2; // earth

  planets.forEach(function(p, i){
    var btn = document.createElement('button');
    btn.className = 'planet-node ' + p.key;
    btn.setAttribute('aria-label', p.name);
    btn.dataset.index = i;

    var sphereWrap = document.createElement('span');
    sphereWrap.style.position = 'relative';
    sphereWrap.style.display = 'inline-block';

    var glow = document.createElement('span');
    glow.className = 'glow-ring';
    sphereWrap.appendChild(glow);

    var sphere = document.createElement('span');
    sphere.className = 'sphere';
    sphere.style.width = p.size + 'px';
    sphere.style.height = p.size + 'px';
    sphere.style.display = 'block';
    sphereWrap.appendChild(sphere);

    if(p.rings){
      var rings = document.createElement('span');
      rings.className = 'saturn-rings';
      sphereWrap.appendChild(rings);
    }

    var tick = document.createElement('span');
    tick.className = 'tick';
    sphereWrap.appendChild(tick);

    btn.appendChild(sphereWrap);
    row.appendChild(btn);

    var dot = document.createElement('button');
    dot.className = 'pager-dot';
    dot.setAttribute('aria-label', 'Go to ' + p.name);
    pager.appendChild(dot);
  });

  var nodes = Array.from(row.querySelectorAll('.planet-node'));
  var dots = Array.from(pager.querySelectorAll('.pager-dot'));
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var busy = false;

  function buildStats(p){
    var strip = document.getElementById('statStrip');
    strip.innerHTML = '';
    [['Diameter', p.diameter], ['Distance from Sun', p.distance], ['Moons', p.moons], ['Orbital period', p.period]]
      .forEach(function(s){
        var el = document.createElement('div');
        el.className = 'stat';
        el.innerHTML = '<span class="stat-label">' + s[0] + '</span><span class="stat-value">' + s[1] + '</span>';
        strip.appendChild(el);
      });
    return Array.from(strip.children);
  }

  function setActive(i, animated){
    if(busy || i === active) { active = i; return; }
    busy = true;
    var prevIdx = active;
    active = i;
    var p = planets[i];

    dots.forEach(function(d, idx){ d.classList.toggle('active', idx === i); });
    if(!reduced && animated !== false){
      anime({ targets: dots[prevIdx], width: 6, backgroundColor: '#5c6091', duration: 350, easing: 'easeOutQuad' });
      anime({ targets: dots[i], width: 18, backgroundColor: '#F4C77B', duration: 350, easing: 'easeOutQuad' });
    }

    // outgoing planet: settle back to rest
    nodes[prevIdx].classList.remove('active');
    var prevGlow = nodes[prevIdx].querySelector('.glow-ring');

    // incoming planet: pop + glow
    nodes[i].classList.add('active');
    var newGlow = nodes[i].querySelector('.glow-ring');

    if(reduced || animated === false){
      newGlow.style.opacity = 1; prevGlow.style.opacity = 0;
      document.getElementById('planetEyebrow').textContent = p.idx;
      document.getElementById('planetName').textContent = p.name.toLowerCase();
      document.getElementById('planetDesc').textContent = p.desc;
      buildStats(p);
      busy = false;
      return;
    }

    var tl = anime.timeline({ easing: 'easeOutQuad' });
    tl.add({ targets: prevGlow, opacity: 0, duration: 300 }, 0)
      .add({ targets: nodes[prevIdx], scale: 1, duration: 400, easing: 'easeOutElastic(1, .6)' }, 0)
      .add({ targets: newGlow, opacity: 1, duration: 400 }, 0)
      .add({ targets: nodes[i], scale: [1, 1.18, 1.08], duration: 550, easing: 'easeOutElastic(1, .6)' }, 0);

    // crossfade text block
    var info = document.getElementById('centerInfo');
    anime({
      targets: [document.getElementById('planetEyebrow'), document.getElementById('planetTitle'),
                document.getElementById('planetDesc'), document.getElementById('planetCta')],
      opacity: [1, 0], translateY: [0, -8], duration: 200, easing: 'easeInQuad',
      complete: function(){
        document.getElementById('planetEyebrow').textContent = p.idx;
        document.getElementById('planetName').textContent = p.name.toLowerCase();
        document.getElementById('planetDesc').textContent = p.desc;
        var statEls = buildStats(p);
        anime.set(statEls, { opacity: 0, translateY: 10 });

        anime.timeline({ easing: 'easeOutQuad' })
          .add({
            targets: [document.getElementById('planetEyebrow'), document.getElementById('planetTitle'),
                      document.getElementById('planetDesc'), document.getElementById('planetCta')],
            opacity: [0, 1], translateY: [10, 0], duration: 380, delay: anime.stagger(50)
          })
          .add({
            targets: statEls, opacity: [0, 1], translateY: [10, 0],
            duration: 420, delay: anime.stagger(70)
          }, '-=200')
          .complete = function(){ busy = false; };
      }
    });
  }

  function introSequence(){
    var glows = nodes.map(function(n){ return n.querySelector('.glow-ring'); });
    if(reduced){
      document.querySelector('.topnav').style.opacity = 1;
      glows[active].style.opacity = 1;
      buildStats(planets[active]);
      dots[active].classList.add('active');
      dots[active].style.width = '18px';
      return;
    }

    anime.set('.topnav', { opacity: 0, translateY: -14 });
    anime.set('#orbitLine', { scaleX: 0 });
    anime.set(nodes, { opacity: 0, translateY: 26, scale: 0.6 });
    anime.set('#centerInfo > *', { opacity: 0, translateY: 16 });
    anime.set(dots, { opacity: 0, scale: 0 });

    var stats = buildStats(planets[active]);
    anime.set(stats, { opacity: 0, translateY: 16 });
    nodes[active].classList.add('active');

    var tl = anime.timeline({ easing: 'easeOutExpo' });
    tl.add({ targets: '.topnav', opacity: 1, translateY: 0, duration: 700 })
      .add({ targets: '#orbitLine', scaleX: 1, duration: 900, easing: 'easeOutQuint' }, '-=500')
      .add({ targets: nodes, opacity: 1, translateY: 0, scale: 1, duration: 750,
             delay: anime.stagger(70, { from: 'center' }), easing: 'easeOutElastic(1, .7)' }, '-=650')
      .add({ targets: glows[active], opacity: 1, duration: 500 }, '-=300')
      .add({ targets: '#centerInfo > *', opacity: 1, translateY: 0, duration: 500,
             delay: anime.stagger(60) }, '-=500')
      .add({ targets: stats, opacity: 1, translateY: 0, duration: 450,
             delay: anime.stagger(70) }, '-=350')
      .add({ targets: dots, opacity: 1, scale: 1, duration: 350, delay: anime.stagger(30) }, '-=350')
      .add({ targets: dots[active], width: 18, duration: 300 }, '-=200');
  }

  // gentle ambient bob for unselected planets
  function ambientDrift(){
    if(reduced) return;
    nodes.forEach(function(n, idx){
      anime({
        targets: n,
        translateY: [0, -6, 0],
        duration: 3200 + idx * 240,
        delay: idx * 180,
        easing: 'easeInOutSine',
        loop: true
      });
    });
  }

  introSequence();
  setTimeout(ambientDrift, 1600);

  nodes.forEach(function(n, idx){
    n.addEventListener('click', function(){ setActive(idx); });
  });
  dots.forEach(function(d, idx){
    d.addEventListener('click', function(){ setActive(idx); });
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight') setActive(Math.min(planets.length - 1, active + 1));
    if(e.key === 'ArrowLeft') setActive(Math.max(0, active - 1));
  });
})();
</script>

</body>
</html>
